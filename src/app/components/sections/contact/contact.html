<form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="message-form" novalidate>
  <p class="intro fg-cyan">Let's build something great together</p>

  @for (field of fields; track field.id) {
    <div class="field">
      <label class="fg-cyan" [for]="field.id">{{ field.label }}</label>
      <input
        [id]="field.id"
        [type]="field.type"
        [formControlName]="field.id"
        [attr.autocomplete]="field.autocomplete"
        [attr.aria-invalid]="showError(field.id)"
        [attr.aria-describedby]="field.id + '-error'"
      />
    </div>
    <p class="error fg-red" [id]="field.id + '-error'">{{ showError(field.id) ? getErrorMessage(field.id) : '' }}</p>
  }

  <label class="fg-cyan" for="message">Message</label>
  <textarea
    id="message"
    formControlName="message"
    rows="5"
    [attr.aria-invalid]="showError('message')"
    aria-describedby="message-error"
  ></textarea>
  <p class="error fg-red" id="message-error">{{ showError('message') ? getErrorMessage('message') : '' }}</p>

  <button type="submit" [disabled]="contactForm.invalid || isSubmitting() || isRateLimited()">
    @if (isRateLimited()) {
      Wait {{ cooldownRemaining() }}
    } @else if (isSubmitting()) {
      Sending...
    } @else {
      Send Message
    }
  </button>

  <p class="status" role="status" [class.fg-green]="submitSuccess()" [class.fg-red]="!submitSuccess()">{{ submitMessage() }}</p>
</form>
